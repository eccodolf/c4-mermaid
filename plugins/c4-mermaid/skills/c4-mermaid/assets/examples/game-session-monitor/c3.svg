/g><g style=""><g fill="#333333" font-family="Arial" text-anchor="start" font-size="13px" style=""><text x="392" y="929">Голубые блоки — компоненты SystemEnforcer; соседний цилиндр — файл бюджета; серые блоки — внешние</text><text x="392" y="945">системы. Пунктир — граница контейнера. Стрелки показывают направленные действия; размеры подобраны</text><text x="392" y="961">для текста. CIM — модель управления Windows; IFEO — параметры запуска процессов; JSON — формат</text><text x="392" y="977">данных.</text></g></g></g><g/><g/></g></svg>