dary-title">Group-Boundary</title><desc id="group-boundary-desc">Offline SVG</desc><metadata>C4 reference: Simon Brown, c4model.com, CC BY 4.0. Shape assets adapted from draw.io C4, Apache-2.0; bundled source revisions and license included.</metadata><rect x="0" y="0" width="320" height="220" fill="#FFFFFF" /><g fill="#FFFFFF" stroke="#444444" stroke-width="2"><rect x="20" y="24" width="280" height="176" fill="none" stroke-dasharray="2 5" /></g><text x="160.0" y="56" fill="#444444" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Group-Boundary</text><text x="160.0" y="75" fill="#444444" font-family="Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">[Group]</text><text x="160.0" y="94" fill="#444444" font-family="Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Offline SVG</text></svg><text x="20" y="1290" font-family="Arial, sans-serif" font-size="12" fill="#404040">Legend: Draw.io C4 glyphs; person silhouette = Person; rounded blocks = System, Container or Component as</text><text x="20" y="1308" font-family="Arial, sans-serif" font-size="12" fill="#404040">labeled. Cylinder = data container (including file/object stores); horizontal cylinder = message bus.</text><text x="20" y="1326" font-family="Arial, sans-serif" font-size="12" fill="#404040">Solid frames = logical/placement scope; dotted frame = organization. Colors identify named roles; sizes</text><text x="20" y="1344" font-family="Arial, sans-serif" font-size="12" fill="#404040">fit text.</text><text x="20" y="1380" font-family="Arial, sans-serif" font-size="12" fill="#404040">C4: Simon Brown · CC BY 4.0 · Shapes adapted from draw.io C4 · Apache-2.0</text></svg>